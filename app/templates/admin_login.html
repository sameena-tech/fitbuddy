<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FitBuddy | Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
  <main class="container narrow">
    <section class="card">
      <div class="badge">ADMIN</div>
      <h1>Admin Dashboard</h1>
      <p>Enter the local admin token configured in your <code>.env</code> file.</p>
      {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
      <form method="get" action="/view-all-users">
        <label>Admin token
          <input type="password" name="admin_token" required>
        </label>
        <button class="btn primary full" type="submit">Open Dashboard</button>
      </form>
      <a class="admin-link" href="/">Back to FitBuddy</a>
    </section>
  </main>
</body>
</html>

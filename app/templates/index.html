<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FitBuddy | AI Fitness Planner</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body class="landing">
  <main class="container narrow">
    <section class="hero card">
      <div class="badge">AI FITNESS PLANNER</div>
      <h1>FitBuddy</h1>
      <p class="subtitle">Create a personalized 7-day workout plan and practical nutrition guidance.</p>

      {% if error %}
      <div class="alert error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/generate-workout" class="form-grid">
        <label>Name
          <input name="username" required maxlength="80" placeholder="Your name">
        </label>

        <label>User ID
          <input name="user_id" required pattern="[A-Za-z0-9_-]+" placeholder="e.g. FB001">
        </label>

        <label>Age
          <input type="number" name="age" min="13" max="100" required>
        </label>

        <label>Weight (kg)
          <input type="number" name="weight" min="20" max="400" step="0.1" required>
        </label>

        <label>Fitness Goal
          <select name="goal" required>
            <option value="weight loss">Weight Loss</option>
            <option value="muscle gain">Muscle Gain</option>
            <option value="general wellness">General Wellness</option>
            <option value="flexibility">Flexibility</option>
          </select>
        </label>

        <label>Workout Intensity
          <select name="intensity" required>
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </label>

        <button class="btn primary full" type="submit">Generate My Plan</button>
      </form>

      <p class="small-note">For general wellness support only. If you have an injury or medical condition, consult a qualified professional.</p>
      <a class="admin-link" href="/view-all-users">Admin dashboard</a>
    </section>
  </main>
</body>
</html>
